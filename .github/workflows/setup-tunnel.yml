name: Setup TCP Tunnel

on:
  workflow_dispatch:

jobs:
  setup-tunnel:
    runs-on: ubuntu-latest
    
    steps:
    - name: Setup nginx stream tunnel on VPS
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_PASS: ${{ secrets.VPS_PASS }}
      run: |
        sudo apt-get install -y sshpass
        
        sshpass -p "$VPS_PASS" ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << 'EOF'
        set -e
        
        echo "=== Installing nginx stream module ==="
        apt-get install -y libnginx-mod-stream
        
        echo "=== Moving HTTPS site from 443 to 8443 ==="
        sed -i 's/listen 443 ssl/listen 8443 ssl/; s/listen \[::\]:443 ssl/listen [::]:8443 ssl/' /etc/nginx/sites-available/live-platform
        
        echo "=== Writing stream dispatch config ==="
        cat > /etc/nginx/stream-webrtc.conf << 'STREAM_CONF'
        stream {
            upstream web_https {
                server 127.0.0.1:8443;
            }
            upstream webrtc_mux {
                server 127.0.0.1:4430;
            }
            # TLS ClientHello（带 SNI）-> 网站；无 TLS（WebRTC-over-TCP）-> 媒体分流器
            map $ssl_preread_server_name $webrtc_backend {
                default web_https;
                ""      webrtc_mux;
            }
            server {
                listen 443;
                ssl_preread on;
                proxy_pass $webrtc_backend;
                proxy_timeout 300s;
                proxy_connect_timeout 10s;
            }
        }
        STREAM_CONF
        
        echo "=== Including stream config in nginx.conf ==="
        if ! grep -q "stream-webrtc.conf" /etc/nginx/nginx.conf; then
            sed -i '/http {/i include /etc/nginx/stream-webrtc.conf;' /etc/nginx/nginx.conf
        fi
        
        echo "=== Testing and reloading nginx ==="
        nginx -t
        systemctl reload nginx
        
        echo "=== Done ==="
        EOF
