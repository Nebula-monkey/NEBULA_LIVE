name: Deploy to VPS

on:
  push:
    branches: [master, server-master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout frontend
      uses: actions/checkout@v4
      with:
        ref: master
        path: frontend
    
    - name: Checkout backend
      uses: actions/checkout@v4
      with:
        ref: server-master
        path: backend
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Build frontend
      run: |
        cd frontend
        npm install
        npm run build
    
    - name: Install backend deps (compile mediasoup here)
      run: |
        cd backend
        npm install
    
    - name: Package everything
      run: |
        tar -czf /tmp/deploy-package.tar.gz frontend backend
    
    - name: Deploy to VPS
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_PASS: ${{ secrets.VPS_PASS }}
      run: |
        sudo apt-get install -y sshpass
        
        # Upload package to VPS
        echo "Uploading package to VPS..."
        sshpass -p "$VPS_PASS" scp -o StrictHostKeyChecking=no /tmp/deploy-package.tar.gz $VPS_USER@$VPS_HOST:/tmp/deploy-package.tar.gz
        
        # Run deployment on VPS
        echo "Running deployment..."
        sshpass -p "$VPS_PASS" ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << 'EOF'
        set -e
        
        echo "=== Starting deployment ==="
        
        # Install Node.js 22 if not installed
        if ! command -v node &> /dev/null || [[ $(node -v) != v22* ]]; then
            echo "Installing Node.js 22..."
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y nodejs
        fi
        
        # Install pm2 if not installed
        if ! command -v pm2 &> /dev/null; then
            echo "Installing pm2..."
            npm install -g pm2
        fi
        
        # Extract package
        echo "Extracting files..."
        cd /tmp
        tar -xzf deploy-package.tar.gz
        
        # Deploy to /opt/live-platform
        mkdir -p /opt/live-platform
        rm -rf /opt/live-platform/frontend /opt/live-platform/server
        cp -r /tmp/frontend /opt/live-platform/frontend
        cp -r /tmp/backend /opt/live-platform/server
        
        # Create required directories
        mkdir -p /opt/live-platform/server/data
        mkdir -p /opt/live-platform/server/uploads
        
        # Stop existing pm2 process
        pm2 delete live-platform 2>/dev/null || true
        
        # Start with pm2
        echo "Starting application..."
        cd /opt/live-platform/server
        export MEDIASOUP_ANNOUNCED_IP=$(curl -s ifconfig.me)
        export NODE_IP=0.0.0.0
        export PORT=3001
        
        pm2 start index.js --name live-platform
        pm2 save
        pm2 startup systemd -u root --hp /root 2>/dev/null || true
        
        echo "=== Deployment complete ==="
        pm2 status
        sleep 3
        pm2 logs live-platform --lines 20 --nostream
        EOF
